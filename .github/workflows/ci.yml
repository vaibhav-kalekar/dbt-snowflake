name: dbt CI

on:
  pull_request:
    paths: ['dbt_snowflake/**', '.github/workflows/ci.yml']

concurrency:
  group: dbt-ci-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # needed to download the prod manifest artifact

env:
  DBT_TARGET: ci
  DBT_CI_SCHEMA: ci_pr_${{ github.event.number }}
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.snowflake_key.p8
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
  GH_TOKEN: ${{ github.token }}

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dbt_snowflake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dbt_snowflake/requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Configure Snowflake credentials
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
          chmod 600 "$SNOWFLAKE_PRIVATE_KEY_PATH"
          mkdir -p ~/.dbt && cp profiles.yml.example ~/.dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps

      - name: Lint SQL (SQLFluff)
        run: sqlfluff lint models macros snapshots tests

      - name: Fetch production manifest (for Slim CI)
        id: manifest
        continue-on-error: true
        working-directory: .
        run: |
          RUN_ID=$(gh run list --workflow cd.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID" && gh run download "$RUN_ID" -n prod-manifest -D dbt_snowflake/prod-state

      - name: Load seed data into the PR schema
        run: dbt seed --target ci

      - name: Build and test - changed models and everything downstream (Slim CI)
        if: steps.manifest.outcome == 'success'
        run: dbt build --target ci --exclude resource_type:seed --select state:modified+ --defer --state prod-state

      - name: Build and test - full project (no manifest available yet)
        if: steps.manifest.outcome != 'success'
        run: dbt build --target ci --exclude resource_type:seed

      - name: Test summary
        if: always()
        run: python scripts/summarise_run_results.py target/run_results.json

      - name: Drop PR schemas
        if: always()
        run: dbt run-operation drop_ci_schemas --target ci

      - name: Remove key material
        if: always()
        run: rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH"
