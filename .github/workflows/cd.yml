name: dbt CD

on:
  push:
    branches: [main]
    paths: ['dbt_snowflake/**', '.github/workflows/cd.yml']
  workflow_dispatch:

concurrency:
  group: dbt-cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  DBT_TARGET: prod
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_PROD_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.snowflake_key.p8
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dbt_snowflake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dbt_snowflake/requirements.txt

      - run: pip install -r requirements.txt

      - name: Configure Snowflake credentials
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PROD_PRIVATE_KEY }}" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
          chmod 600 "$SNOWFLAKE_PRIVATE_KEY_PATH"
          mkdir -p ~/.dbt && cp profiles.yml.example ~/.dbt/profiles.yml

      - run: dbt deps

      - name: Deploy - models, snapshots and tests
        run: dbt build --target prod --exclude resource_type:seed

      - name: Generate docs and manifest
        run: dbt docs generate --target prod

      # CI downloads this to run Slim CI (state:modified+ with --defer).
      - uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: dbt_snowflake/target/manifest.json
          retention-days: 30

      - name: Test summary
        if: always()
        run: python scripts/summarise_run_results.py target/run_results.json

      - name: Remove key material
        if: always()
        run: rm -f "$SNOWFLAKE_PRIVATE_KEY_PATH"
