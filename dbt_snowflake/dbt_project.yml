name: 'my_dbt_snowflake'
version: '1.1.0'
config-version: 2
profile: 'dbt_profile'
require-dbt-version: ">=1.8.0,<1.9.0"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Claim banding thresholds - change here, not in SQL
  claim_low_max: 1000
  claim_medium_max: 5000

# Model layers: staging (1:1 clean) -> intermediate (business logic) -> marts (consumption)
models:
  my_dbt_snowflake:
    +on_schema_change: append_new_columns
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ['intermediate']
    marts:
      +materialized: table
      +schema: marts
      +tags: ['marts']

# Seeds are synthetic data for dev/CI only. In prod, RAW is loaded by the ingestion pipeline.
seeds:
  my_dbt_snowflake:
    +schema: raw
    raw_claims:
      +enabled: "{{ target.name != 'prod' }}"
      +column_types:
        claim_amount: number(18,2)
        claim_date: date
        loaded_at: timestamp_ntz
    raw_patients:
      +enabled: "{{ target.name != 'prod' }}"
      +column_types:
        date_of_birth: date
        loaded_at: timestamp_ntz
    legacy_claims_extract:
      +schema: migration
      +column_types:
        claim_amount: number(18,2)
        claim_date: date

data_tests:
  +store_failures: false
